services:
  - type: web
    name: mailharbor
    runtime: node
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: npm install --prefix backend --omit=dev
    startCommand: npm --prefix backend start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: PG_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INBOUND_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REALTIME_ALLOWED_ORIGINS
        sync: false
