databases:
  - name: mailharbor-db
    databaseName: mailharbor
    user: mailharbor
    plan: basic_256mb
    region: ohio
    postgresMajorVersion: "18"

services:
  - type: web
    name: mailharbor-api
    runtime: node
    plan: starter
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: npm install --prefix backend --omit=dev
    startCommand: npm --prefix backend start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mailharbor-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INBOUND_WEBHOOK_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: REALTIME_PUBLIC_URL
        fromService:
          type: web
          name: mailharbor-realtime
          property: host
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: mailharbor-realtime
    runtime: node
    plan: starter
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: npm install --prefix backend --omit=dev
    startCommand: npm --prefix backend run realtime
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mailharbor-db
          property: connectionString
      - key: REALTIME_ALLOWED_ORIGINS
        sync: false

  - type: worker
    name: mailharbor-delivery-worker
    runtime: node
    plan: starter
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: npm install --prefix backend --omit=dev
    startCommand: npm --prefix backend run worker
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mailharbor-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
