<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c68"><title>MailHarbor</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="mark">M</span><span>MailHarbor</span></div><button class="compose" id="compose">＋ Compose</button><nav id="folders"><button class="active" data-folder="Inbox">▣ <span>Inbox</span><b>3</b></button><button data-folder="Starred">☆ <span>Starred</span></button><button data-folder="Sent">↗ <span>Sent</span></button><button data-folder="Drafts">▤ <span>Drafts</span></button><button data-folder="Spam">! <span>Spam</span></button><button data-folder="Trash">⌫ <span>Trash</span></button></nav><div class="sidefoot">A calmer place for your mail.</div></aside><main><header><button id="menu" class="iconbtn" aria-label="Menu">☰</button><div class="search">⌕ <input id="search" placeholder="Search mail" aria-label="Search mail"></div><div class="avatar">Y</div></header><section class="content"><div class="heading"><div><small>YOUR MAIL</small><h1 id="heading">Inbox</h1><p>Everything important, gathered in one place.</p></div><button id="refresh" class="iconbtn" aria-label="Refresh">↻</button></div><div class="toolbar"><button id="markread">Mark read</button><button id="archive">Archive</button><button id="delete">Delete</button><span id="count"></span></div><div id="messages" class="messages"></div><p class="preview-note">Preview mode · Sample messages only · Sending is not configured</p></section></main></div><dialog id="composer"><form method="dialog" id="composeform"><div class="modalhead"><b>New message</b><button class="iconbtn" value="cancel" aria-label="Close">×</button></div><label>To<input type="email" id="to" placeholder="name@example.com" required></label><label>Subject<input id="subject" placeholder="Subject"></label><label>Message<textarea id="body" rows="7" placeholder="Write your message…"></textarea></label><div class="modalfoot"><span id="draftstatus">Local preview only</span><button class="send" type="submit">Save draft</button></div></form></dialog><script src="app.js"></script></body></html>
